name: Outdated dependencies

# Fails once a day while a direct dependency, or pnpm in `packageManager`, has a newer version
# than the one the lockfile resolves (or `packageManager` pins) and isn't held back on purpose in
# `scripts/dependencies/held-back.json`, or when that list needs looking at (a recheck day has
# passed, an entry is stale); lists them in the job summary (CONTRIBUTING.md, Daily checks).
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Check for newer versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reads the lockfile and the registry alone: nothing is installed, so no dependency's code
      # runs (a `pnpm run` would install the dependencies first). The check only needs Node.js and
      # pnpm.
      - name: Check
        run: node scripts/dependencies/outdated.ts
